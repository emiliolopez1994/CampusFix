<div class="auth-page">
  <div class="auth-card">

    <div class="brand">
      <div class="brand-icon">CF</div>

      <div>
        <h1>CampusFix</h1>
        <p>Sistema de gestión de incidencias</p>
      </div>
    </div>

    <div class="header">
      <h2>Iniciar sesión</h2>
      <p>Ingresa tus credenciales para continuar.</p>
    </div>

    <form (ngSubmit)="iniciarSesion()">

      <div class="field">
        <label for="correo">Correo electrónico</label>

        <input
          id="correo"
          name="correo"
          type="email"
          [(ngModel)]="correo"
          placeholder="usuario@campusfix.com"
          autocomplete="email"
          required
        />
      </div>

      <div class="field">
        <label for="password">Contraseña</label>

        <input
          id="password"
          name="password"
          type="password"
          [(ngModel)]="password"
          placeholder="Ingresa tu contraseña"
          autocomplete="current-password"
          required
        />
      </div>

      <div *ngIf="error" class="error">
        {{ error }}
      </div>

      <button
        type="submit"
        class="login-button"
        [disabled]="cargando"
      >
        {{ cargando ? 'Ingresando...' : 'Iniciar sesión' }}
      </button>

    </form>

    <div class="register">
      <span>¿No tienes una cuenta?</span>
      <a routerLink="/registro">Crear cuenta</a>
    </div>

  </div>
</div>
